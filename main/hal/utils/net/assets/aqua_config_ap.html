<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aqua Timer Setup</title>
  <style>
    :root {
      --bg: #0b1418;
      --card: #14232b;
      --line: #24404c;
      --accent: #2fb28a;
      --text: #eef6f9;
      --muted: #8fb0bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 460px; padding: 24px 18px 48px; }
    h1 { font-size: 22px; margin: 12px 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      background: #0d1a20;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .primary { background: var(--accent); color: #05130d; }
    .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    #status { min-height: 20px; font-size: 14px; margin: 12px 2px; }
    .ok { color: var(--accent); }
    .err { color: #ff8a9c; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Aqua Timer</h1>
    <p class="sub">Point the watch at your routines repo.</p>

    <form id="form" class="card">
      <label for="ssid">Wi-Fi network</label>
      <input id="ssid" name="ssid" autocapitalize="none" autocomplete="off" placeholder="Network name" />

      <label for="password">Wi-Fi password</label>
      <input id="password" name="password" type="password" autocomplete="off" placeholder="Leave blank if open" />

      <label for="base_url">Routines folder URL</label>
      <input id="base_url" name="base_url" autocapitalize="none" autocomplete="off"
             placeholder="https://raw.githubusercontent.com/OWNER/REPO/main/routines" />
      <div class="hint">
        The folder that holds <b>index.csv</b> and your routine CSV files.
        For a GitHub repo, use the <b>raw.githubusercontent.com</b> address of the folder.
      </div>

      <button type="submit" class="primary">Save</button>
    </form>

    <div id="status"></div>
    <button id="done" class="ghost">Done — close setup</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Saving…';
      statusEl.className = '';
      const body = new URLSearchParams(new FormData(e.target)).toString();
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
        });
        const data = await res.json();
        statusEl.textContent = data.message || (res.ok ? 'Saved' : 'Error');
        statusEl.className = res.ok ? 'ok' : 'err';
      } catch (err) {
        statusEl.textContent = 'Could not reach the watch. Try again.';
        statusEl.className = 'err';
      }
    });

    document.getElementById('done').addEventListener('click', async () => {
      statusEl.textContent = 'Closing…';
      statusEl.className = '';
      try {
        await fetch('/close', { method: 'POST' });
      } catch (err) { /* the AP drops as it closes; ignore */ }
      statusEl.textContent = 'You can disconnect from the watch Wi-Fi now.';
      statusEl.className = 'ok';
    });
  </script>
</body>
</html>
