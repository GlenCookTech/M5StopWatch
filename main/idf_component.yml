## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # Shared by both boards
  espressif/i2c_bus: ^1.5.0
  # Supplies DnsServer for the Wi-Fi config portals (badge + aqua timer)
  78/esp-wifi-connect: 3.1.3
  # StopWatch (esp32s3) only: ES8311 audio codec and the FFT app's DSP
  espressif/esp_codec_dev:
    version: ^1.5.4
    rules:
      - if: 'target in [esp32s3]'
  espressif/esp-dsp:
    version: ^1.8.0
    rules:
      - if: 'target in [esp32s3]'
