name: Build

on:
  push:
    branches:
      # '**' not '*': a single star does not match '/' so slash-named branches
      # (feat/x, claude/x) would never trigger on push
      - '**'
    paths-ignore:
      - '**.md'
      - 'routines/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'routines/**'
      - 'LICENSE'
  workflow_dispatch:

# Only keep the newest run per branch/PR; cancel superseded ones to save minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: idf.py build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # StopWatch wearable — default target, plain build/
          - target: esp32s3
            build_args: ''
            build_dir: build
          # M5Paper v1.1 — separate build dir + sdkconfig so the targets never
          # fight over ./sdkconfig
          - target: esp32
            build_args: '-B build.m5paper -DIDF_TARGET=esp32 -DSDKCONFIG=sdkconfig.m5paper'
            build_dir: build.m5paper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # components/ is git-cloned by fetch_repos.py and managed_components/ by the
      # IDF component manager — both are .gitignore'd, so cache them to avoid
      # re-cloning every run. Keyed on the files that decide their contents, plus
      # the target since the component manager solves per-target dependency sets.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            components
            managed_components
          key: idf-deps-${{ matrix.target }}-${{ hashFiles('repos.json', 'dependencies.lock', 'main/idf_component.yml') }}
          restore-keys: |
            idf-deps-${{ matrix.target }}-

      # Runs inside the official ESP-IDF Docker image. fetch_repos.py must run
      # first (it clones components/ and applies patches/). The container runs as
      # root while the checkout is owned by the runner user, so git would refuse
      # with "dubious ownership"; GIT_CONFIG_* whitelists every repo for git. It
      # is set as env vars (not `git config ... '*'`) because an assignment RHS is
      # never glob-expanded, so the `*` survives the action's command layering.
      # If the v5.5.4 image tag is ever unavailable, use release-v5.5 instead.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: ${{ matrix.target }}
          path: '.'
          command: export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=* && python3 fetch_repos.py && idf.py ${{ matrix.build_args }} build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ matrix.build_dir }}/StopWatch-UserDemo.bin
            ${{ matrix.build_dir }}/bootloader/bootloader.bin
            ${{ matrix.build_dir }}/partition_table/partition-table.bin
            ${{ matrix.build_dir }}/flasher_args.json
