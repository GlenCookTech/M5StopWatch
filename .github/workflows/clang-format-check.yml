name: clang-format Check

env:
  INCLUDE_REGEX: ^.*\.((((c|C)(c|pp|xx|\+\+)?$)|((h|H)h?(pp|xx|\+\+)?$))|(inl|ino|pde|proto|cu))$

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      # '**' not '*': a single star does not match '/' in branch names
      - '**'
    paths:
      - '*'
      - '**.ino'
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - '**.c'
      - '**.inl'
      - '**clang-format-check.yml'
      - '**.clang-format'
  pull_request:
    paths:
      - '**.ino'
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - '**.c'
      - '**.inl'
      - '**clang-format-check.yml'
      - '**.clang-format'
  workflow_dispatch:

# Only keep the newest run per branch/PR; cancel superseded ones to save minutes.
concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting-check:
    name: Formatting Check
    # Upstream runs this on M5Stack's own runner fleet. This fork has no
    # self-hosted runner, so the job sat queued forever and the check could
    # never report — clang-format needs nothing a hosted runner lacks.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - check: './'    # path to include
            exclude: '/(assets|hal/drivers)'    # path to exclude
          #- check: 'src'
          #  exclude: '(Fonts)' # Exclude file paths containing "Fonts"
          #- check: 'examples'
          #  exclude: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run clang-format style check for C/C++/Protobuf programs.
        uses: jidicula/clang-format-action@v4.10.2 # Using include-regex 10.x or later
        with:
          clang-format-version: '22'
          check-path: ${{ matrix.path['check'] }}
          exclude-regex: ${{ matrix.path['exclude'] }}
          include-regex: ${{ env.INCLUDE_REGEX }}
